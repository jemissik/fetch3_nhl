name: fetch3
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  - python=3.11
  - attrs
  - torchvision
  - pytorch > 2
  - matplotlib
  - pyviz::hvplot
  - pyviz::panel
  - pyviz::datashader
  - conda-forge::jupyterlab
  - conda-forge::jupyter_bokeh
  - pyviz::pyviz_comms
  - numpy
  - pandas
  - scipy
  - xarray
  - netCDF4
  - dask
  - bottleneck
  - ipympl
  - invoke
  - flake8
  - PyYAML
  - click
  - conda-forge::botorch
  - conda-forge::boa-framework==0.11.0
  - scikit-learn<1.6 # This needs to be <1.6 until a new version of boa is released. see https://github.com/madeline-scyphers/boa/issues/178
  - pip
  - pip:
    - -e .
